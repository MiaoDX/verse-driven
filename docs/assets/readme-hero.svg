<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Verse-Driven Development</title>
  <desc id="desc">A visual summary of local scripture packs flowing through MCP and hooks into one-turn coding context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101418"/>
      <stop offset="0.48" stop-color="#17201d"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d76e"/>
      <stop offset="1" stop-color="#c89635"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <style>
      .title { font: 700 54px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f5f7fa; letter-spacing: 0; }
      .subtitle { font: 400 24px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c7d2d6; letter-spacing: 0; }
      .label { font: 700 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f5f7fa; letter-spacing: 0; }
      .small { font: 500 15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #a9b8bf; letter-spacing: 0; }
      .mono { font: 600 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #b6f3cf; letter-spacing: 0; }
      .card { fill: rgba(255,255,255,0.055); stroke: rgba(255,255,255,0.16); stroke-width: 1.2; }
      .line { stroke: #7ee787; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 10; opacity: 0.75; }
    </style>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <g opacity="0.12">
    <circle cx="1020" cy="80" r="180" fill="#7ee787"/>
    <circle cx="120" cy="470" r="160" fill="#79c0ff"/>
  </g>

  <g transform="translate(72 72)">
    <text class="title" x="0" y="0" dominant-baseline="hanging">Verse-Driven Development</text>
    <text class="subtitle" x="4" y="78">Optional wisdom-literature framing for coding agents, without persistent context pollution.</text>
  </g>

  <g filter="url(#softShadow)">
    <rect class="card" x="72" y="204" rx="18" ry="18" width="278" height="186"/>
    <text class="label" x="104" y="244">bundled packs</text>
    <text class="small" x="104" y="280">KJV Bible</text>
    <text class="small" x="104" y="310">Dao De Jing</text>
    <text class="small" x="104" y="340">Heart Sutra</text>
    <text class="mono" x="104" y="370">sha256 verified</text>

    <rect class="card" x="462" y="178" rx="22" ry="22" width="276" height="238"/>
    <circle cx="600" cy="250" r="56" fill="url(#gold)" opacity="0.95"/>
    <path d="M575 250h50M600 225v50" stroke="#17201d" stroke-width="9" stroke-linecap="round"/>
    <text class="label" x="529" y="338">local MCP + CLI</text>
    <text class="small" x="516" y="372">stdio server · hooks · recap</text>

    <rect class="card" x="850" y="204" rx="18" ry="18" width="278" height="186"/>
    <text class="label" x="884" y="244">coding agents</text>
    <text class="small" x="884" y="280">Claude Code</text>
    <text class="small" x="884" y="310">Codex</text>
    <text class="mono" x="884" y="350">one turn only</text>
  </g>

  <path class="line" d="M350 297 C405 297 412 297 462 297"/>
  <path class="line" d="M738 297 C794 297 804 297 850 297"/>

  <g transform="translate(72 444)">
    <rect x="0" y="-18" width="1056" height="54" rx="16" fill="rgba(0,0,0,0.22)" stroke="rgba(255,255,255,0.12)"/>
    <text class="small" x="28" y="16">Default silent</text>
    <text class="small" x="210" y="16">Explicit marker required</text>
    <text class="small" x="470" y="16">Terminal-only recap</text>
    <text class="small" x="700" y="16">Offline and local</text>
    <text class="small" x="890" y="16">Benchmark-gated</text>
  </g>
</svg>
